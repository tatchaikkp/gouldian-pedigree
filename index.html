<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบประวัตินกฟินซ์ 7 สี - Gouldian Pedigree</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --male-color: #0284c7;
      --male-bg: #e0f2fe;
      --female-color: #db2777;
      --female-bg: #fce7f3;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px 12px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 24px; }
    .logo { width: 120px; height: 120px; margin: 0 auto 12px auto; display: block; object-fit: contain; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header p { font-size: 15px; color: var(--text-muted); margin: 0; font-weight: 500; }

    .search-box { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
    .search-box label { font-size: 14px; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 8px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px 16px; font-size: 15px; border: 1.5px solid var(--border-color); border-radius: 10px; outline: none; transition: 0.2s; }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15); }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    button:hover { background: #1b5e20; }

    .bird-card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 20px; position: relative; overflow: hidden; }
    .bird-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--primary); }
    
    .card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title h2 { font-size: 20px; font-weight: 700; margin: 0; color: var(--text-main); }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge.male { background: var(--male-bg); color: var(--male-color); }
    .badge.female { background: var(--female-bg); color: var(--female-color); }

    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f1f5f9; padding: 12px; border-radius: 10px; margin: 12px 0; text-align: center; }
    .color-item span { font-size: 11px; color: var(--text-muted); display: block; }
    .color-item strong { font-size: 14px; color: var(--text-main); }

    .info-row { font-size: 14px; margin: 8px 0; color: var(--text-main); display: flex; gap: 8px; }
    .info-row span { color: var(--text-muted); }

    .award-box { background: #fffbe3; border: 1px solid #fef08a; padding: 12px; border-radius: 10px; margin-top: 12px; color: #854d0e; font-size: 13.5px; }
    .award-box strong { display: block; margin-bottom: 2px; }

    .tree-section { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .tree-section h3 { font-size: 16px; font-weight: 700; margin: 0 0 16px 0; color: var(--text-main); display: flex; align-items: center; gap: 6px; }

    .parent-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .parent-card.father { border-left: 4px solid var(--male-color); }
    .parent-card.mother { border-left: 4px solid var(--female-color); }

    .parent-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .parent-color { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

    .grandparents { background: #ffffff; border-radius: 8px; padding: 8px 12px; font-size: 12px; border: 1px solid var(--border-color); }
    .grandparents div { margin: 4px 0; }

    .link-id { color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 600; }
    .link-id:hover { color: #1b5e20; }
    .error { color: #ef4444; text-align: center; font-weight: 600; padding: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://lh3.googleusercontent.com/d/1LrJKf0ojAJS0MJ-EYAwWN00qo6awr47V" alt="KOZ OF FINCH" class="logo">
      <p>ระบบตรวจสอบประวัตินกฟินซ์ 7 สี</p>
    </div>
    
    <div class="search-box">
      <label for="ringInput">ค้นหาข้อมูลหมายเลขห่วง:</label>
      <div class="input-group">
        <input type="text" id="ringInput" placeholder="พิมพ์รหัสห่วง เช่น ZAM01">
        <button onclick="searchBird()">ค้นหา</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const CHICKS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuLVsFoVzNh0n31YpAmVfOXwn28FveBZMi916Q1sLeAhysmB7vQnTS-hnm_0oGEzxUcg3f9qtShhQF/pub?gid=0&single=true&output=csv';  
    const PARENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuLVsFoVzNh0n31YpAmVfOXwn28FveBZMi916Q1sLeAhysmB7vQnTS-hnm_0oGEzxUcg3f9qtShhQF/pub?gid=106258138&single=true&output=csv'; 
    
    let allBirds = [];

    function loadData() {
      allBirds = [];
      Papa.parse(CHICKS_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: function(res1) {
          if(res1.data) allBirds = allBirds.concat(res1.data);
          Papa.parse(PARENTS_CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res2) {
              if(res2.data) allBirds = allBirds.concat(res2.data);
            }
          });
        }
      });
    }
    loadData();

    // ฟังก์ชั่นช่วยดึงข้อมูลจากหลายชื่อคอลัมน์ และตัดช่องว่างส่วนเกิน
    function getValue(obj, keys) {
      if (!obj) return '';
      if (!Array.isArray(keys)) keys = [keys];
      
      const objKeys = Object.keys(obj);
      for (let key of keys) {
        const foundKey = objKeys.find(k => k.trim().toLowerCase() === key.trim().toLowerCase());
        if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== null) {
          return String(obj[foundKey]).trim();
        }
      }
      return '';
    }

    function findBird(id) {
      if (!id) return null;
      const cleanId = String(id).trim().toLowerCase();
      return allBirds.find(b => {
        const ring = getValue(b, ['รหัสห่วง', 'รหัสพ่อนก', 'รหัสแม่นก', 'ID']).toLowerCase();
        return ring === cleanId;
      });
    }

    function searchBird(targetId = null) {
      const ringInput = document.getElementById('ringInput');
      const ringId = targetId || ringInput.value.trim();
      if (!ringId) return;

      ringInput.value = ringId;
      const resultDiv = document.getElementById('result');
      const bird = findBird(ringId);

      if (!bird) {
        resultDiv.innerHTML = `<div class="bird-card"><p class="error">❌ ไม่พบข้อมูลนกรหัสห่วง "${ringId}" ในระบบ</p></div>`;
        return;
      }

      const birdId = getValue(bird, ['รหัสห่วง', 'รหัสพ่อนก', 'รหัสแม่นก', 'ID']);
      // รองรับทั้ง 'รหัสพ่อนก' และ 'รหัสพ่อพันธุ์'
      const fatherId = getValue(bird, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ', 'Father ID', 'Father']);
      // รองรับทั้ง 'รหัสแม่นก' และ 'รหัสแม่พันธุ์'
      const motherId = getValue(bird, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่', 'Mother ID', 'Mother']);

      const father = findBird(fatherId);
      const mother = findBird(motherId);

      const genderVal = getValue(bird, ['เพศ', 'Gender']);
      const genderBadge = genderVal === 'ผู้' || genderVal === 'Male'
        ? '<span class="badge male">♂ เพศผู้</span>' 
        : (genderVal === 'เมีย' || genderVal === 'Female' ? '<span class="badge female">♀ เพศเมีย</span>' : '');

      const awardVal = getValue(bird, ['ประวัติรางวัล', 'รางวัล']);
      const awardInfo = awardVal && awardVal !== '-' 
        ? `<div class="award-box">🏆 <strong>ประวัติรางวัล / ผลงาน:</strong> ${awardVal}</div>` 
        : '';

      const countryVal = getValue(bird, ['สายเลือด/ประเทศ', 'ประเทศ', 'สายเลือด']);
      const countryInfo = countryVal && countryVal !== '-' 
        ? `<div class="info-row"><span>สายเลือด/ประเทศ:</span> 🌍 <strong>${countryVal}</strong></div>` 
        : '';

      resultDiv.innerHTML = `
        <div class="bird-card">
          <div class="card-title">
            <h2>ห่วงหมายเลข: ${birdId}</h2>
            ${genderBadge}
          </div>

          <div class="color-grid">
            <div class="color-item"><span>สีหัว</span><strong>${getValue(bird, ['สีหัว', 'HEAD']) || '-'}</strong></div>
            <div class="color-item"><span>สีอก</span><strong>${getValue(bird, ['สีอก', 'CHEST']) || '-'}</strong></div>
            <div class="color-item"><span>สีตัว</span><strong>${getValue(bird, ['สีตัว', 'BODY']) || '-'}</strong></div>
          </div>

          ${countryInfo}
          <div class="info-row"><span>วันเกิด / วันฟัก:</span> <strong>${getValue(bird, ['วันเกิด', 'BORN']) || '-'}</strong></div>
          <div class="info-row"><span>จุดเด่น / หมายเหตุ:</span> <strong>${getValue(bird, ['จุดเด่น', 'Note', 'หมายเหตุ']) || '-'}</strong></div>
          ${awardInfo}
        </div>

        <div class="tree-section">
          <h3>🌲 แผนผังสายเลือด (Pedigree Tree)</h3>
          
          <div class="parent-card father">
            <div class="parent-header">
              <span>พ่อพันธุ์ (Father): ${renderLink(fatherId)}</span>
              ${father && getValue(father, ['สายเลือด/ประเทศ', 'ประเทศ']) ? `<span>🌍 ${getValue(father, ['สายเลือด/ประเทศ', 'ประเทศ'])}</span>` : ''}
            </div>
            <div class="parent-color">${father ? `สี: ${getValue(father, ['สีหัว', 'HEAD'])}/${getValue(father, ['สีอก', 'CHEST'])}/${getValue(father, ['สีตัว', 'BODY'])}` : ''}</div>
            
            <div class="grandparents">
              <div>├─ <b>ปู่ (Father's Father):</b> ${renderLink(father ? getValue(father, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ']) : '')}</div>
              <div>└─ <b>ย่า (Father's Mother):</b> ${renderLink(father ? getValue(father, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่']) : '')}</div>
            </div>
          </div>

          <div class="parent-card mother">
            <div class="parent-header">
              <span>แม่พันธุ์ (Mother): ${renderLink(motherId)}</span>
              ${mother && getValue(mother, ['สายเลือด/ประเทศ', 'ประเทศ']) ? `<span>🌍 ${getValue(mother, ['สายเลือด/ประเทศ', 'ประเทศ'])}</span>` : ''}
            </div>
            <div class="parent-color">${mother ? `สี: ${getValue(mother, ['สีหัว', 'HEAD'])}/${getValue(mother, ['สีอก', 'CHEST'])}/${getValue(mother, ['สีตัว', 'BODY'])}` : ''}</div>
            
            <div class="grandparents">
              <div>├─ <b>ตา (Mother's Father):</b> ${renderLink(mother ? getValue(mother, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ']) : '')}</div>
              <div>└─ <b>ยาย (Mother's Mother):</b> ${renderLink(mother ? getValue(mother, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่']) : '')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderLink(id) {
      if (!id || id === '-' || id.trim() === '') return '<span style="color:#cbd5e1;">ไม่ระบุ</span>';
      const exists = findBird(id);
      if (exists) {
        return `<span class="link-id" onclick="searchBird('${id}')">${id}</span>`;
      }
      return `<span>${id}</span> <small style="color:#94a3b8;">(ไม่มีข้อมูล)</small>`;
    }
  </script>
</body>
</html>
