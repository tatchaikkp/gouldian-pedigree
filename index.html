<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบประวัตินกฟินซ์ 7 สี - Gouldian Pedigree</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --accent-gold: #d97706;
      --gold-bg: #fffbe3;
      --gold-border: #fef08a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --male-color: #0284c7;
      --male-bg: #e0f2fe;
      --female-color: #db2777;
      --female-bg: #fce7f3;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px 12px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }

    /* Header & Logo */
    .header { text-align: center; margin-bottom: 24px; }
    .logo { width: 110px; height: 110px; margin: 0 auto 12px auto; display: block; object-fit: contain; border-radius: 50%; border: 3px solid var(--accent-gold); box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2); }
    .header p { font-size: 15px; color: var(--text-muted); margin: 0; font-weight: 500; }

    /* Search Box */
    .search-box { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
    .search-box label { font-size: 14px; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 8px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px 16px; font-size: 15px; border: 1.5px solid var(--border-color); border-radius: 10px; outline: none; transition: 0.2s; }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15); }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    button:hover { background: #1b5e20; }

    /* Back Button Bar */
    .nav-bar { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 14px; }
    .btn-back { background: #ffffff; color: #1e293b; border: 2px solid var(--primary); padding: 10px 18px; font-size: 14px; font-weight: 700; border-radius: 25px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); }
    .btn-back:hover { background: var(--primary-light); color: var(--primary); }

    /* Main Bird Card */
    .bird-card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 20px; position: relative; overflow: hidden; }
    .bird-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--primary); }
    
    .card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title h2 { font-size: 20px; font-weight: 700; margin: 0; color: var(--text-main); }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge.male { background: var(--male-bg); color: var(--male-color); }
    .badge.female { background: var(--female-bg); color: var(--female-color); }

    /* Grid แสดงสีแบบ 3 ช่อง */
    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f1f5f9; padding: 10px 8px; border-radius: 10px; margin: 10px 0; text-align: center; }
    .color-item span { font-size: 11px; color: var(--text-muted); display: block; }
    .color-item strong { font-size: 13.5px; color: var(--text-main); }

    .info-row { font-size: 14px; margin: 8px 0; color: var(--text-main); display: flex; gap: 8px; }
    .info-row span { color: var(--text-muted); }

    /* Hall of Fame / Award Box Design */
    .award-card { background: linear-gradient(135deg, #fffbe3 0%, #fff7ed 100%); border: 1.5px solid #fde047; padding: 14px 16px; border-radius: 12px; margin-top: 14px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.08); }
    .award-title { color: var(--accent-gold); font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; border-bottom: 1px dashed #fde047; padding-bottom: 4px; }
    .award-item { font-size: 13.5px; color: #78350f; font-weight: 500; margin: 4px 0; line-height: 1.5; }

    /* Country Badge */
    .country-badge { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; }

    /* Tree View Section */
    .tree-section { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .tree-section h3 { font-size: 16px; font-weight: 700; margin: 0 0 16px 0; color: var(--text-main); display: flex; align-items: center; gap: 6px; }

    .parent-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 14px; transition: 0.2s; }
    .parent-card:hover { border-color: var(--primary); }
    .parent-card.father { border-left: 4px solid var(--male-color); }
    .parent-card.mother { border-left: 4px solid var(--female-color); }

    .parent-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }

    .grandparents { background: #ffffff; border-radius: 8px; padding: 8px 12px; font-size: 12px; border: 1px solid var(--border-color); margin-top: 10px; }
    .grandparents div { margin: 4px 0; }

    .link-id { color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #e8f5e9; transition: 0.15s; }
    .link-id:hover { background: #2e7d32; color: #ffffff; }
    .error { color: #ef4444; text-align: center; font-weight: 600; padding: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://lh3.googleusercontent.com/d/1LrJKf0ojAJS0MJ-EYAwWN00qo6awr47V" alt="KOZ OF FINCH" class="logo">
      <p>ระบบตรวจสอบประวัตินกฟินซ์ 7 สี</p>
    </div>
    
    <div class="search-box">
      <label for="ringInput">ค้นหาข้อมูลหมายเลขห่วง:</label>
      <div class="input-group">
        <input type="text" id="ringInput" placeholder="พิมพ์รหัสห่วง เช่น ZAM01">
        <button onclick="handleSearchClick()">ค้นหา</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const CHICKS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuLVsFoVzNh0n31YpAmVfOXwn28FveBZMi916Q1sLeAhysmB7vQnTS-hnm_0oGEzxUcg3f9qtShhQF/pub?gid=0&single=true&output=csv';  
    const PARENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuLVsFoVzNh0n31YpAmVfOXwn28FveBZMi916Q1sLeAhysmB7vQnTS-hnm_0oGEzxUcg3f9qtShhQF/pub?gid=106258138&single=true&output=csv'; 
    
    let allBirds = [];
    let historyStack = [];
    let currentBirdId = '';

    function loadData() {
      allBirds = [];
      Papa.parse(CHICKS_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: function(res1) {
          if(res1.data) allBirds = allBirds.concat(res1.data);
          Papa.parse(PARENTS_CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res2) {
              if(res2.data) allBirds = allBirds.concat(res2.data);
            }
          });
        }
      });
    }
    loadData();

    function getValue(obj, keys) {
      if (!obj) return '';
      if (!Array.isArray(keys)) keys = [keys];
      
      const objKeys = Object.keys(obj);
      for (let key of keys) {
        const foundKey = objKeys.find(k => k.trim().toLowerCase() === key.trim().toLowerCase());
        if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== null) {
          return String(obj[foundKey]).trim();
        }
      }
      return '';
    }

    // ฟังก์ชั่นคำนวณอายุแบบ ปี เดือน วัน
    function calculateAge(dateStr) {
      if (!dateStr || dateStr === '-') return '';
      
      const parts = dateStr.split(/[/.-]/);
      let birthDate;
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          birthDate = new Date(parts[0], parts[1] - 1, parts[2]);
        } else {
          // สมมติวันที่รูปแบบ 12/1/2025 -> parts[0]=12, parts[1]=1, parts[2]=2025
          birthDate = new Date(parts[2], parts[1] - 1, parts[0]);
        }
      } else {
        birthDate = new Date(dateStr);
      }

      if (isNaN(birthDate.getTime())) return '';

      const today = new Date();
      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += lastMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      let ageParts = [];
      if (years > 0) ageParts.push(years + ' ปี');
      if (months > 0) ageParts.push(months + ' เดือน');
      if (days > 0 || ageParts.length === 0) ageParts.push(days + ' วัน');

      return ` <span style="color:var(--primary); font-weight:600;">(อายุ ${ageParts.join(' ')})</span>`;
    }

    function findBird(id) {
      if (!id) return null;
      const cleanId = String(id).trim().toLowerCase();
      return allBirds.find(b => {
        const ring = getValue(b, ['รหัสห่วง', 'รหัสพ่อนก', 'รหัสแม่นก', 'ID']).toLowerCase();
        return ring === cleanId;
      });
    }

    function handleSearchClick() {
      const ringId = document.getElementById('ringInput').value.trim();
      if (!ringId) return;
      historyStack = [];
      currentBirdId = ringId;
      searchBird(ringId);
    }

    function navigateToBird(targetRingId) {
      if (currentBirdId && currentBirdId.toLowerCase() !== targetRingId.toLowerCase()) {
        historyStack.push(currentBirdId);
      }
      currentBirdId = targetRingId;
      searchBird(targetRingId);
    }

    function goBack() {
      if (historyStack.length > 0) {
        const previousBirdId = historyStack.pop();
        currentBirdId = previousBirdId;
        searchBird(previousBirdId);
      }
    }

    function renderColorGrid(birdObj) {
      if (!birdObj) return '<div style="font-size:12px; color:#cbd5e1; margin:6px 0; text-align:center;">ไม่มีข้อมูลสี</div>';
      
      const head = getValue(birdObj, ['สีหัว', 'HEAD']) || '-';
      const chest = getValue(birdObj, ['สีอก', 'CHEST']) || '-';
      const body = getValue(birdObj, ['สีตัว', 'BODY']) || '-';

      return `
        <div class="color-grid">
          <div class="color-item"><span>สีหัว</span><strong>${head}</strong></div>
          <div class="color-item"><span>สีอก</span><strong>${chest}</strong></div>
          <div class="color-item"><span>สีตัว</span><strong>${body}</strong></div>
        </div>
      `;
    }

    function searchBird(ringId) {
      const ringInput = document.getElementById('ringInput');
      ringInput.value = ringId;
      const resultDiv = document.getElementById('result');
      const bird = findBird(ringId);

      if (!bird) {
        resultDiv.innerHTML = `<div class="bird-card"><p class="error">❌ ไม่พบข้อมูลนกรหัสห่วง "${ringId}" ในระบบ</p></div>`;
        return;
      }

      const birdId = getValue(bird, ['รหัสห่วง', 'รหัสพ่อนก', 'รหัสแม่นก', 'ID']);
      const fatherId = getValue(bird, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ', 'Father ID', 'Father']);
      const motherId = getValue(bird, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่', 'Mother ID', 'Mother']);

      const father = findBird(fatherId);
      const mother = findBird(motherId);

      const genderVal = getValue(bird, ['เพศ', 'Gender']);
      const genderBadge = genderVal === 'ผู้' || genderVal === 'Male'
        ? '<span class="badge male">♂ เพศผู้</span>' 
        : (genderVal === 'เมีย' || genderVal === 'Female' ? '<span class="badge female">♀ เพศเมีย</span>' : '');

      const birdAward = getValue(bird, ['ประวัติรางวัล', 'รางวัล']);
      const fatherAward = father ? getValue(father, ['ประวัติรางวัล', 'รางวัล']) : '';
      const motherAward = mother ? getValue(mother, ['ประวัติรางวัล', 'รางวัล']) : '';

      let awardsListHtml = '';
      if (birdAward && birdAward !== '-') {
        awardsListHtml += `<div class="award-item">🏆 <b>นกตัวนี้:</b> ${birdAward}</div>`;
      }
      if (fatherAward && fatherAward !== '-') {
        awardsListHtml += `<div class="award-item">🎖️ <b>พ่อพันธุ์ (${fatherId}):</b> ${fatherAward}</div>`;
      }
      if (motherAward && motherAward !== '-') {
        awardsListHtml += `<div class="award-item">🎖️ <b>แม่พันธุ์ (${motherId}):</b> ${motherAward}</div>`;
      }

      const awardBoxHtml = awardsListHtml !== '' 
        ? `<div class="award-card">
            <div class="award-title">🎖️ เกียรติยศ & ประวัติรางวัลสายเลือด (Hall of Fame)</div>
            ${awardsListHtml}
           </div>` 
        : '';

      const countryVal = getValue(bird, ['สายเลือด/ประเทศ', 'ประเทศ', 'สายเลือด']);
      const countryInfo = countryVal && countryVal !== '-' 
        ? `<div class="country-badge">🌍 สายเลือดนำเข้า: ${countryVal}</div>` 
        : '';

      const birthDateStr = getValue(bird, ['วันเกิด', 'BORN']) || '-';
      const ageStr = calculateAge(birthDateStr);

      const backButtonHtml = historyStack.length > 0 
        ? `<div class="nav-bar">
            <button class="btn-back" onclick="goBack()">⬅️ ย้อนกลับไปดูนกตัวก่อนหน้า (${historyStack[historyStack.length - 1]})</button>
           </div>` 
        : '';

      resultDiv.innerHTML = `
        ${backButtonHtml}

        <div class="bird-card">
          <div class="card-title">
            <h2>ห่วงหมายเลข: ${birdId}</h2>
            ${genderBadge}
          </div>

          ${countryInfo}

          ${renderColorGrid(bird)}

          <div class="info-row"><span>วันเกิด / วันฟัก:</span> <strong>${birthDateStr}${ageStr}</strong></div>
          <div class="info-row"><span>จุดเด่น / หมายเหตุ:</span> <strong>${getValue(bird, ['จุดเด่น', 'Note', 'หมายเหตุ']) || '-'}</strong></div>
          
          ${awardBoxHtml}
        </div>

        <div class="tree-section">
          <h3>🌲 แผนผังสายเลือด (Pedigree Tree)</h3>
          
          <!-- พ่อพันธุ์ -->
          <div class="parent-card father">
            <div class="parent-header">
              <span>พ่อพันธุ์ (Father): ${renderLink(fatherId)}</span>
              ${father && getValue(father, ['สายเลือด/ประเทศ', 'ประเทศ']) ? `<span>🌍 ${getValue(father, ['สายเลือด/ประเทศ', 'ประเทศ'])}</span>` : ''}
            </div>
            
            ${renderColorGrid(father)}
            
            <div class="grandparents">
              <div>├─ <b>ปู่ (Father's Father):</b> ${renderLink(father ? getValue(father, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ']) : '')}</div>
              <div>└─ <b>ย่า (Father's Mother):</b> ${renderLink(father ? getValue(father, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่']) : '')}</div>
            </div>
          </div>

          <!-- แม่พันธุ์ -->
          <div class="parent-card mother">
            <div class="parent-header">
              <span>แม่พันธุ์ (Mother): ${renderLink(motherId)}</span>
              ${mother && getValue(mother, ['สายเลือด/ประเทศ', 'ประเทศ']) ? `<span>🌍 ${getValue(mother, ['สายเลือด/ประเทศ', 'ประเทศ'])}</span>` : ''}
            </div>
            
            ${renderColorGrid(mother)}
            
            <div class="grandparents">
              <div>├─ <b>ตา (Mother's Father):</b> ${renderLink(mother ? getValue(mother, ['รหัสพ่อนก', 'รหัสพ่อพันธุ์', 'พ่อ']) : '')}</div>
              <div>└─ <b>ยาย (Mother's Mother):</b> ${renderLink(mother ? getValue(mother, ['รหัสแม่นก', 'รหัสแม่พันธุ์', 'แม่']) : '')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderLink(id) {
      if (!id || id === '-' || id.trim() === '') return '<span style="color:#cbd5e1;">ไม่ระบุ</span>';
      const exists = findBird(id);
      if (exists) {
        return `<span class="link-id" onclick="navigateToBird('${id}')">${id}</span>`;
      }
      return `<span>${id}</span> <small style="color:#94a3b8;">(ไม่มีข้อมูล)</small>`;
    }
  </script>
</body>
</html>
